    { name = "YashBarfa0603", email = "yashbarfa67@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "bcrypt>=5.0.0",
    "cloudinary>=1.46.2",
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "numpy>=2.0.2",
    "opencv-python>=5.0.0.93",
    "psycopg>=3.2.13",
    "pydantic[email]>=2.13.5",
